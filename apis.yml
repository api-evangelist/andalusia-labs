name: Andalusia Labs
description: 'Andalusia Labs is an applied research laboratory headquartered in Palo Alto building
  internet-native economic infrastructure. Its flagship platform, OpenGDP, is the "Global Base Layer
  for Programmable GDP" — an EVM-compatible execution layer and network stack for moving value
  (stablecoin settlement), programming assets (tokenized securities, deposits, and commodities), and
  orchestrating real-world economic workflows across enterprises, financial institutions, and
  governments with institutional-grade privacy, compliance, and audit controls. OpenGDP ships
  developer documentation (build applications, build networks, run validators), a live demo, and a
  smart-contract bug-bounty program. Backed by Pantera Capital, Founders Fund, Naval Ravikant,
  Anthony Pompliano, and the co-founders of Alchemy.'
